        pan:
          description: The card number.
          type: string
          maxLength: 19
          minLength: 13
          pattern: \d{13,19}
        type:
          type: string
          default: CARD
        validUntil:
          description: The date and time after which the alias is automatically deleted. Set at creation. Must be in <a href='https://en.wikipedia.org/wiki/ISO_8601' target='_blank'>ISO-8601</a> format (`yyyy-MM-dd'T'HH:mm:ss'Z'`).
          type: string
          format: date-time
      allOf:
        - $ref: '#/components/schemas/TokenizeRequest'
      required:
        - type
    CertificateTokenizeRequest:
      type: object
      properties:
        certificate:
