  /v1/transactions/secureFields:
    post:
      operationId: secureFieldsInit
      summary: Initialize a Secure Fields transaction
      description: |-
        Proceed with the steps below to process [Secure Fields payment transactions](https://docs.datatrans.ch/docs/integrations-secure-fields):

        - Call the /v1/transactions/secureFields endpoint to retrieve a `transactionId`. The success result of this API call is a `HTTP 201` status code with a `transactionId` in the response body.
        - Initialize the `SecureFields` JavaScript library with the returned `transactionId`:
        ```js
        var secureFields = new SecureFields();
        secureFields.init(
            transactionId, {
                cardNumber: "cardNumberPlaceholder",
                cvv: "cvvPlaceholder",
            });
        ```
        - Handle the `success` event of the `secureFields.submit()` call. Example `success` event data:
        ```json
        {
            "event":"success",
            "data": {
                "transactionId":"{transactionId}",
                "cardInfo":{"brand":"MASTERCARD","type":"credit","usage":"consumer","country":"CH","issuer":"DATATRANS"},
                "redirect":"https://pay.sandbox.datatrans.com/upp/v1/3D2/{transactionId}"
            }
        }
        ```
        - If 3D authentication is required, the `redirect` property will indicate the URL that the browser needs to be redirected to.
        - Use the [Authorize an authenticated transaction](#operation/authorize-split) endpoint to authorize the Secure Fields transaction. This is required to finalize the authorization process with Secure Fields.
        - Use the `transactionId` to check the [status](#operation/status) and to [settle](#operation/settle), [cancel](#operation/cancel) or [credit (refund)](#operation/refund) an transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DefaultSecureFieldsInitRequest'
            examples:
              secureFieldsInitRequest1:
                summary: Basic request
                description: secureFieldsInitRequest1
                value:
                  amount: 100
                  currency: CHF
                  returnUrl: http://example.org/return
                  returnMethod: GET
      responses:
        '201':
          description: Transaction successfully initialized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecureFieldsInitResponse'
              examples:
                secureFieldsInitResponse:
                  description: secureFieldsInitResponse
                  value:
                    transactionId: '260710115301331147'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionsResponseBase'
              examples:
                secureFieldsInitErrorResponse:
                  description: secureFieldsInitErrorResponse
                  value:
                    error:
                      code: INVALID_PROPERTY
                      message: init.amount must be > 0
      security:
        - Basic: []
      tags:
        - /v1/transactions
      x-codeSamples:
        - label: curl
          source: |-
            curl -i -X POST https://api.sandbox.datatrans.com/v1/transactions/secureFields 
            	--user {merchantId}:{password} 
            	-H 'Content-Type: application/json; charset=UTF-8' 
            	-d '{
