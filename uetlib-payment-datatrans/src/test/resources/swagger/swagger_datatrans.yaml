    CardholderPhoneNumber:
      description: |
        The work phone provided by the Cardholder. The object contains the following fields:
          cc -> Country Code of the phone, limited to 1-3 characters
          subscriber -> subscriber section of the number, limited to maximum 15 characters.

        Refer to ITU-E.164 for additional information on format and length.
      type: object
      properties:
        cc:
          type: string
        subscriber:
          type: string
    DccInitRequest:
      description: |
        For DCC data obtained from a previous DCC request for a given credit card, currency, and amount, use `correlationId`.
        Otherwise, for DCC data obtained from external sources, provide `currency`, `amount`, and `rate`.
        If DCC data is supplied, the payment page will bypass the DCC selection view and proceed directly to the 3D Secure process.
        Authorization will use the provided DCC data.
        If credit card details were used when obtaining the DCC data, they must also be provided.
      type: object
      properties:
        amount:
          description: The amount in your targeted currency
          type: integer
          format: int64
        correlationId:
          description: The DCC correlation ID
          type: string
          format: uuid
        currency:
          description: The targeted currency
          type: string
        rate:
          description: The conversion rate in your targeted currency (e.g. `0.1234`)
          type: number
          format: double
    DeviceTokenInitCard:
      description: Device token authorization
      type: object
      properties:
        cryptogram:
          description: The cryptogram of the token
          type: string
        eci:
          description: the Eci of the token
          type: string
        expiryMonth:
          description: The expiry month of the network token.
          type: string
          maxLength: 2
          minLength: 2
          pattern: \d{2}
        expiryYear:
          description: The expiry year of the network token.
          type: string
          maxLength: 2
          minLength: 2
          pattern: \d{2}
        token:
          description: Device token value.
          type: string
        tokenType:
          description: The scheme which issued the network token.
          type: string
          enum:
            - APPLE_PAY
            - GOOGLE_PAY
            - SAMSUNG_PAY
        type:
          type: string
          default: DEVICE_TOKEN
      allOf:
        - $ref: '#/components/schemas/CardInit'
      required:
        - expiryMonth
        - expiryYear
        - token
        - tokenType
        - type
    DimocoInitRequest:
      type: object
      properties:
        alias:
          description: An alias (token) received from a previous transaction if `option.createAlias` was set to `true`. In order to retrieve the alias from a previous transaction, use the [Status API](#operation/status).
          type: string
          example: AAABeCBPbiHssdexyrAAAYkaznYWAPYt
          externalDocs:
            url: https://docs.datatrans.ch/docs/tokenization#section-token-format
        stepUp:
          description: Whether to force a step-up authentication for alias payments. When true, the customer will be redirected for confirmation even when paying with a stored alias.
          type: boolean
    ElvInitRequest:
      description: ELV specific payment parameters.
      type: object
