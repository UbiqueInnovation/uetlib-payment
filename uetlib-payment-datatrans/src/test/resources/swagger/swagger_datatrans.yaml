          type: string
        type:
          type: string
          default: CERTIFICATE
      allOf:
        - $ref: '#/components/schemas/TokenizeRequest'
      required:
        - type
    CustomTokenizeRequest:
      type: object
      properties:
        custom:
          description: The custom field to be tokenized.
          type: string
          maxLength: 7500
          pattern: \d{0,7500}
        type:
          type: string
          default: CUSTOM
      allOf:
        - $ref: '#/components/schemas/TokenizeRequest'
      required:
        - type
    CvvTokenizeRequest:
      type: object
      properties:
        cvv:
          description: The CVV number.
          type: string
          maxLength: 4
          minLength: 3
          pattern: \d{3,4}
        type:
          type: string
          default: CVV
      allOf:
        - $ref: '#/components/schemas/TokenizeRequest'
      required:
        - type
    GooglePayTokenizeRequest:
