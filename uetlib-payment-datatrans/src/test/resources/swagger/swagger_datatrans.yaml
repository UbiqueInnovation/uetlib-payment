    Browser:
      description: Contains browser information.
      type: object
      properties:
        browserAcceptHeader:
          description: |
            Exact content of the HTTP accept headers as sent to the 3DS Requestor from the Cardholder's browser.
            This field is limited to maximum 2048 characters  and if the total length exceeds the limit, the 3DS Server
            truncates the excess portion.

            This field is required for requests where deviceChannel=02 (BRW).
          type: string
        browserColorDepth:
          description: |
            Value representing the bit depth of the colour palette for displaying images, in bits
            per pixel. Obtained from Cardholder browser using the screen.colorDepth property. The
            field is limited to 1-2 characters.

            For a list of possible values, refer to
            https://www.w3schools.com/jsref/prop_screen_colordepth.asp
          type: string
          enum:
            - '1'
            - '4'
            - '8'
            - '15'
            - '16'
            - '24'
            - '32'
            - '48'
        browserIP:
          description: |
            IP address of the browser as returned by the HTTP headers to the 3DS Requestor.
            The field is limited to maximum 45 characters and the accepted values are as following:
              - IPv4 address is represented in the dotted decimal format of 4 sets of decimal
                numbers separated by dots. The decimal number in each and every set is in the range
                0 - 255. Example: 1.12.123.255
              - IPv6 adress is represented as eight groups of four hexadecimal digits, each group
                representing 16 bits (two octets). The groups are separated by colons (:).
                Example: 2011:0db8:85a3:0101:0101:8a2e:0370:7334
          type: string
        browserJavaEnabled:
          description: |
            Boolean that represents the ability of the cardholder browser to execute Java. Value is
            returned from the navigator.javaEnabled property.
          type: boolean
        browserJavascriptEnabled:
          description: |
            Boolean that represents the ability of the cardholder browser to execute JavaScript.
          type: boolean
        browserLanguage:
          description: |
            Value representing the browser language as defined in IETF BCP47. The value is limited
            to 1-8 characters. Value is returned from navigator.language property.
            Required when BrowserJavaScriptEnabled = true; otherwise Optional.
          type: string
        browserScreenHeight:
          description: |
            Total height of the Cardholder's screen in pixels. Value is returned from the
            screen.height property. The value is limited to 1-6 characters.

            Required when BrowserJavaScriptEnabled = true; otherwise Optional.
          type: integer
          format: int32
        browserScreenWidth:
          description: |
            Total width of the Cardholder's screen in pixels. Value is returned from the
            screen.width property. The value is limited to 1-6 characters.

            Required when BrowserJavaScriptEnabled = true; otherwise Optional.
          type: integer
          format: int32
        browserTZ:
          description: |
            Time zone offset in minutes between UTC and the Cardholder Browser local time. Note that
            the offset is positive if the local time zone is behind UTC and negative if it is ahead.

            Required when BrowserJavaScriptEnabled = true; otherwise Optional.
          type: integer
          format: int32
        browserUserAgent:
          description: |
            Exact content of the HTTP user-agent header. The field is limited to maximum 2048
            characters. If the total length of the User-Agent sent by the browser exceeds 2048
            characters, the 3DS Server truncates the excess portion.
          type: string
        challengeWindowSize:
          description: |
            Dimensions of the challenge window that has been displayed to the Cardholder. The ACS
            shall reply with content that is formatted to appropriately render in this window to
            provide the best possible user experience.

            Preconfigured sizes are width X height in pixels of the window displayed in the
            Cardholder browser window. This is used only to prepare the CReq request and it is not
            part of the AReq flow. If not present it will be omitted.

            Accepted values are:
            	01 -> 250 x 400
            	02 -> 390 x 400
            	03 -> 500 x 600
            	04 -> 600 x 400
            	05 -> Full screen
          type: string
          enum:
            - '01'
            - '02'
            - '03'
            - '04'
            - '05'
    BuyerMetaData:
      description: Buyer Meta Data
      type: object
      properties:
        buyerIsATraveler:
          description: True, if the account holder of the amazon account is actually one of the travelers, false otherwise.
          type: boolean
        hasOpenDispute:
          description: True if the buyer has an ongoing dispute regarding a past purchase.
          type: boolean
        isFirstTimeCustomer:
          description: True if the buyer is purchasing from the merchant for the first time. Else false.
          type: boolean
        language:
          description: "Language in which the buyer is viewing the site at the time of placing the order in 'language-LOCALE' format example: en-US. Use ISO 639-1:2002 code for the language part (en) and ISO 3166-1 alpha-2 for the LOCALE part (US)."
          type: string
        numberOfDisputedPurchases:
          description: The number of purchases that has been disputed by the buyer when making purchases from the merchant.
          type: integer
          format: int32
        numberOfPastPurchases:
          description: The number of purchases the buyer has made from the merchant in the past.
          type: integer
          format: int32
        recipientEmailMatches:
          description: True, if the recipient email is exactly the same as the one on the amazon account used for payment, false otherwise.
          type: boolean
        riskScore:
          description: The risk score which the merchant computes for a buyer. The value must be a decimal in the range between 0 (lowest risk) and 1 (highest risk).
          type: string
        userAgent:
          description: 'The user agent of the browser used by the buyer to make the purchase on merchant site. Example: Mozilla/5.0 (Macintosh; Intel Mac OS X 10_12_6) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/70.0.3538.102 Safari/537.36.'
          type: string
        version:
          description: The version of BuyerMetaData field (used for tracking schema changes to the field).
          type: string
    CardInit:
      type: object
      discriminator:
        propertyName: type
        mapping:
          PLAIN: '#/components/schemas/PlainInitCard'
          ALIAS: '#/components/schemas/AliasInitCard'
          DEVICE_TOKEN: '#/components/schemas/DeviceTokenInitCard'
      oneOf:
