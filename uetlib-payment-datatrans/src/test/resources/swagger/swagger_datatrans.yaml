tags:
  - name: /v1/transactions
  - name: /v2/transactions
    description: |
      Transactions API v2 is the next generation of our transactions API. While it is available to all merchants, it does not yet offer full feature and payment method parity with v1, so it is not generally recommended at this time.

      We will continue adding payment methods and feature parity over time in the coming months.

      If you do not use Mobile SDK 4, we currently recommend staying on transactions API v1.

      If you want to upgrade to Mobile SDK 4, transactions API v2 is required. Please refer to our [Mobile SDK 4 migration guide](https://docs.datatrans.ch/docs/mobile-sdk-4-migration-guide).
  - name: /v1/aliases
    description: |
      The aliases API gives you complete control over a Datatrans alias, be it a card number
      alias or an alias of a non-card payment method such as PayPal, Postfinance etc.

      Note that the operations of this API apply only to the most recent Datatrans alias format.
      Please reach out to support@datatrans.ch if you are not sure which alias format you have in use.

      ### Alias access
      By default, only the merchant that created the alias has access to it. Contact us, if you have a use case
      where you need to share the alias.
  - name: /v1/reconciliations
  - name: /v1/multicurrency
x-tagGroups:
  - name: Transactions
    tags:
      - /v1/transactions
      - /v2/transactions
  - name: Vault API
    tags:
      - /v1/aliases
  - name: Reconciliations
    tags:
      - /v1/reconciliations
  - name: Multicurrency
    tags:
      - /v1/multicurrency
