        PFP:
          $ref: '#/components/schemas/PostfinancePayDetail'
        refno:
          description: The merchant's reference number. It should be unique for each transaction.
          type: string
        refno2:
          description: Optional customer's reference number. Supported by some payment methods or acquirers.
          type: string
        refundedAmount:
          type: integer
          format: int64
        settledAmount:
          type: integer
          format: int64
        status:
          description: |
            The transaction status

            |Status|Description|
            |:---|:---|
            |open| When a transaction was initialized. A transaction is initialized after a successful init request.|
            |authenticated| When a transaction was authenticated. This status is only set if you defer the authorization from the authentication.|
            |authorized| When a transaction was authorized. This status is only set if you defer the settlement from the authorization.|
            |settled| When a transaction was settled partially or fully.|
            |card_checked| When a card check was performed successfully.|
            |canceled| When a transaction was canceled by the user.|
            |timeout| When a transaction was automatically canceled after a timeout occurred.|
            |error| When a transaction failed.|
          type: string
          enum:
            - open
            - authorized
            - authenticated
            - settled
            - refunded
            - card_checked
            - canceled
