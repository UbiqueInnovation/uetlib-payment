        lastName:
          description: Last name of the person
          type: string
        name:
          description: Name of the person
          type: string
        phoneNumber:
          description: Phone number of the person
          type: string
        sortingCode:
          description: The sorting code of the person
          type: string
        street:
          description: Street of the person
          type: string
        street2:
          description: Secondary street name of the person
          type: string
        title:
          description: Title of the person
          type: string
        zipCode:
          description: Postal code of the person
          type: string
    BoncardRequest:
      description: Boncard specific request parameters
      type: object
      properties:
        alias:
          description: An alias (token) received from a previous transaction if `option.createAlias` was set to `true`. In order to retrieve the alias from a previous transaction, use the [Status API](#operation/status).
          type: string
          example: AAABeCBPbiHssdexyrAAAYkaznYWAPYt
          externalDocs:
            url: https://docs.datatrans.ch/docs/tokenization#section-token-format
        cvv:
          type: string
      required:
        - alias
    ByjunoAuthorizeRequest:
      type: object
      properties:
        alias:
          description: An alias (token) received from a previous transaction if `option.createAlias` was set to `true`. In order to retrieve the alias from a previous transaction, use the [Status API](#operation/status).
          type: string
          example: AAABeCBPbiHssdexyrAAAYkaznYWAPYt
          externalDocs:
            url: https://docs.datatrans.ch/docs/tokenization#section-token-format
        cembraPayPaymentMethod:
          description: Type of CembraPay product. Always required for requests of type REG and SCR. Also is required for requests of type AUT, when token is not provided. List of product types (can be extended by new products).
          type: string
          enum:
            - SINGLE-INVOICE
            - SINGLE-INVOICE-RISKONMERCHANT
            - CEMBRAPAY-INVOICE
            - CEMBRAPAY-INVOICE-RISKONMERCHANT
            - INSTALLMENT_3
            - INSTALLMENT_4
            - INSTALLMENT_6
            - INSTALLMENT_12
            - INSTALLMENT_24
            - INSTALLMENT_36
            - INSTALLMENT_48
            - INSTALLMENT_3-RISKONMERCHANT
            - INSTALLMENT_4-RISKONMERCHANT
            - INSTALLMENT_6-RISKONMERCHANT
            - INSTALLMENT_12-RISKONMERCHANT
            - INSTALLMENT_24-RISKONMERCHANT
            - INSTALLMENT_36-RISKONMERCHANT
            - INSTALLMENT_48-RISKONMERCHANT
            - WALLET
            - CPMI
        customData:
          description: A list of custom data fields. It can accept up to 10 entries.
          type: array
          items:
            type: string
            description: A list of custom data fields. It can accept up to 10 entries.
        customerConsents:
          description: List of Customer consents. Mandatory except authorizations submitted by Token to CPMI payment method
          type: array
          items:
            $ref: '#/components/schemas/CembraPayCustomerConsent'
        customerEmailConfirmed:
          description: Indicates that the customer email address is confirmed.
          type: boolean
          default: false
          deprecated: true
        customerInfo1:
          description: Customer information for credit check.
          type: string
        customerInfo2:
          description: Customer information for credit check.
          type: string
        deliveryMethod:
          description: Can be one of POST (Delivery by Swiss Post), SHOP (Point of Sale) or HLD (Home Delivery Service)
          type: string
        deviceFingerprintId:
          description: Identification of the customer in the shop
          type: string
        docValidTill:
          description: Validity date of verified document. ISO8601 Date Only in format 'yyyy-MM-dd'..
          type: string
        downpaymentToMerchantAmount:
          description: In case Customer makes downpayment to merchant then it should be provided. This amount is part of the main Amount, so customer will be financed/blocked difference. Amount in smallest money unit for the Currency (cents for CHF).
          type: integer
          format: int32
        emailVerificationType:
          description: 'List of possible verification types for customer contacts: - MERCHANT: contact is verified by Merchant. - CEMBRAPAY: contact is verified by CembraPay. - OTHER: contact is verified by 3rd party or somehow else.'
          type: string
          enum:
            - MERCHANT
            - CEMBRAPAY
            - OTHER
        firstRateAmount:
          description: Amount of the first rate paid by the customer.
          type: integer
          format: int32
        inSwitzerlandSince:
          description: Date from which Customer(person) lives in Swizerland. ISO8601 Date Only in format 'yyyy-MM-dd'.. Not expected for Customer(company).
          type: string
        integrationModule:
          description: This is optional field to track Integration versioning on the client/merchant side. Used for debugging and traceability.
          type: string
        isAbove18:
          description: "'true' if Customer(person) is known as person above 18 years old - e.g. Customer had approved this in Merchants system."
          type: boolean
        loggedIn:
          description: This field must be set to 'true' in case, if Customer is logged into Merchants system (Customer is known to Merchant).
          type: boolean
        mobileVerificationType:
          description: 'List of possible verification types for customer contacts: - MERCHANT: contact is verified by Merchant. - CEMBRAPAY: contact is verified by CembraPay. - OTHER: contact is verified by 3rd party or somehow else.'
          type: string
          enum:
            - MERCHANT
            - CEMBRAPAY
            - OTHER
        msgExtensions:
          description: List of additional data entries. Only known Keys will be processed. Prior agreement with CembraPay required about data structure and usage
          type: array
          items:
            $ref: '#/components/schemas/CembraPayMsgExtension'
        nationality:
          description: Nationality of Customer(person), ISO3166-1 alpha 2 code (two letters). Not expected for Customer(company)
          type: string
        orderDownpaymentToMerchantAmount:
          description: In case Customer makes downpayment to merchant then it should be provided. This amount is part of the main Amount, so customer will be financed/blocked difference. Amount in smallest money unit for the Currency (cents for CHF).
          type: integer
          format: int32
        orderSubscriptionType:
          description: If the purchased good is a subscription, the matching Validity should be given.
          type: string
          enum:
            - YEARLY
            - MONTHLY
            - OTHER
        paperInvoice:
          description: Whether or not to send a paper invoice.
          type: boolean
        payoutInfo:
          description: Additional Identifier that can be submitted during AUT or CHK and will be shown in CembraPay RAF (Reconciliation Advisory File) to merchant
          type: string
        permitType:
          description: Type of Swiss Residence permission. Not expected for Customer(company)
          type: string
        phoneBusiness:
          description: Business phone of the Customer
          type: string
        repaymentType:
          description: Number from 1 to 20 to indicate the repayment schedule. This is used in combination with payment methods and defined per client configuration.
          type: integer
          format: int32
          maximum: 20
          minimum: 0
        requestedCreditLimit:
          description: Optional amount of requested credit limit, which should be taken into account during Consumer onboarding (for new Consumers)
          type: integer
          format: int32
        riskOwner:
          description: Defines which party should take the risk.
          type: string
          enum:
            - IJ
            - CLIENT
        sessionId:
          description: Browser session id of the customer.
          type: string
        sessionIpPort:
          description: Source port number from Http Header (first 2 bytes) of the customer browser session should be provided.
          type: string
        siteId:
          description: Can be used in case when client operates different legally separated stores / points of sale.
          type: string
        subscriptionType:
          description: 'If the purchased good is a subscription, the matching Validity should be given. Values: YEARLY, MONTHLY, OTHER'
          type: string
        subtype:
          description: The Byjuno specific payment method used for the transaction.
          type: string
          enum:
            - INVOICE
            - INSTALLMENT
            - BYJUNO-INVOICE
            - MONTHLYINVOICE
        transactionChannel:
          description: ' List of possible transaction channels: - WEB: purchase made via Merchant&#x27;s web shop. - POS: purchase registered manually by Merchant&#x27;s employee using Merchants portal provided by CembraPay. - APP: purchase made via Merchant&#x27;s mobile app. - OTH: other (none of above).'
          type: string
        verifiedDocument1Issuer:
          description: Verified document issuer.
          type: string
        verifiedDocument1Number:
          description: Verified document number.
          type: string
        verifiedDocument1Type:
          description: Indication if merchant is having verified documents from client request.
          type: string
          enum:
            - swiss-travel-pass
            - other
        verifiedEmail:
          description: Indicates that the customer email address is confirmed.
          type: boolean
          default: false
        verifiedMobile:
          description: Indicates that the customer mobile number is confirmed.
          type: boolean
          default: false
      required:
        - subtype
    Card:
      type: object
      discriminator:
        propertyName: type
        mapping:
          PLAIN: '#/components/schemas/PlainCard'
          ALIAS: '#/components/schemas/AliasCard'
          NETWORK_TOKEN: '#/components/schemas/NetworkTokenCard'
          DEVICE_TOKEN: '#/components/schemas/DeviceTokenCard'
      oneOf:
        - $ref: '#/components/schemas/PlainCard'
        - $ref: '#/components/schemas/AliasCard'
        - $ref: '#/components/schemas/NetworkTokenCard'
        - $ref: '#/components/schemas/DeviceTokenCard'
    CardOnFileAuthorize:
      description: |-
        Card On File (COF) parameters. COF usually is handled by Datatrans aliases. This feature is only for specific use cases where the Datatrans alias solution cannot be used.
        This feature needs to be enabled on the merchant configuration by Datatrans.
      type: object
      properties:
        enroll:
          description: If `true`, a Card On File (COF) enrollment is performed. The created card on file ID will be returned in the authorize response. This COF ID can be reused in subsequent MIT authorizations.
          type: boolean
        id:
          description: The card on file ID to be used for this transaction.
          type: string
    CembraPayCustomerConsent:
      description: List of Customer consents. Mandatory except authorizations submitted by Token to CPMI payment method
      type: object
      properties:
        consentDate:
          description: DateTime when Consent was captured. ISO8601 Date with time in format 'yyyy-MM-ddTHH:mm:ssZ'.
          type: string
        consentProvidedAt:
          description: 'List of possible Consent providing channels:  - MERCHANT: consent collected by Merchant in Merchant web shop. Usually by additions in Merchants Shop terms and conditions. - MERCHANT-POS: consent collected at Merchants Pos - CEMBRAPAY-CHECKOUT: consent collected via CembraPay Checkout UI - CEMBRAPAY-REGISTRATION: consent collected via CembraPay Registration UI - AFFILIATE: consent collected by affiliate - OTHER: other way of collecting consent'
          type: string
        consentReference:
          description: The encoded base64 reference to the given consent (document version, URL, registration of agreed terms etc).
          type: string
        consentType:
          description: 'List of possible Consents, consumers can provide to CembraPay: - SCREENING: by providing this consent, consumer agrees that CembraPay can process screening data. Merchant must get this Consent from Consumer before send SCR request to CembraPay Api. - CEMBRAPAY-TC: by providing this consent, consumer agrees with CembraPay terms and conditions. - MARKETING: by providing this consent, consumer agrees that CembraPay can use his data for Marketing purposes.'
          type: string
    CembraPayMsgExtension:
      description: List of additional data entries. Only known Keys will be processed. Prior agreement with CembraPay required about data structure and usage
      type: object
      properties:
        key:
          description: Key is used to identify type of data, provided in Value field.
          type: string
        value:
          description: Data provided additionally to common request structure. Value must be base64 encoded.
          type: string
    CustomerRequest:
      description: Whenever the payment method supports customer details, the `customer` object can be used. The required fields may vary depending on the payment method. For example, in some cases the field `birthDate` is mandatory.
      type: object
      properties:
        birthDate:
          description: The birth date of the customer. Must be in <a href='https://en.wikipedia.org/wiki/ISO_8601' target='_blank'>ISO-8601</a> format (`YYYY-MM-DD`).
          type: string
          format: date
        cellPhone:
          description: Cell Phone number of the customer.
          type: string
          maxLength: 50
        city:
          description: The city of the customer.
          type: string
        companyLegalForm:
          description: The legal form of the company (AG, GmbH, ...)
          type: string
        companyRegisterNumber:
          description: The register number of the company. Only applicable if `type=C`
          type: string
        country:
          description: 2 letter ISO 3166-1 alpha-2 country code
          type: string
        email:
          description: The email address of the customer.
          type: string
        firstName:
          description: The first name of the customer.
          type: string
        gender:
          description: Gender of the customer. `female` or `male`.
          type: string
        id:
          description: Unique customer identifier
          type: string
        ipAddress:
          description: The ip address of the customer.
          type: string
        language:
          description: The language of the customer.
          type: string
        lastName:
          description: The last name of the customer.
          type: string
        name:
          description: The name of the company. Only applicable if `type=C`
          type: string
        phone:
          description: Phone number of the customer.
          type: string
          maxLength: 50
        street:
          description: The street of the customer.
          type: string
        street2:
          description: "Additional street information. For example: '3rd floor'"
          type: string
        title:
          description: Something like `Ms` or `Mrs`
          type: string
        type:
          description: |-
            `P` or `C` depending on whether the customer is private or a company.
            If `C`, the fields `name` and `companyRegisterNumber` are required
          type: string
        zipCode:
          description: Zip code of the customer.
          type: string
    DccAuthorizeRequest:
      description: |
        For DCC data obtained from a previous DCC request for a given credit card, currency, and amount, use `correlationId`.
        Otherwise, for DCC data obtained from external sources, provide `currency`, `amount`, and `rate`.
        If credit card details were used when obtaining the DCC data, they must also be provided.
      type: object
      properties:
        amount:
          description: The amount in your targeted currency
          type: integer
          format: int64
        correlationId:
          description: The DCC correlation ID
          type: string
          format: uuid
        currency:
          description: The targeted currency
          type: string
        rate:
          description: The conversion rate in your targeted currency (e.g. `0.1234`)
          type: number
          format: double
    DeltaVistaData:
      description: DVI has no specific request parameters but we need an empty object here to handle it as a DVI request.
      type: object
    DeviceTokenCard:
      description: Device token authorization
      type: object
      properties:
        cryptogram:
          description: The cryptogram of the token
          type: string
        eci:
          description: the Eci of the token
          type: string
        expiryMonth:
          description: The expiry month of the network token.
          type: string
          maxLength: 2
          minLength: 2
          pattern: \d{2}
        expiryYear:
          description: The expiry year of the network token.
          type: string
          maxLength: 2
          minLength: 2
          pattern: \d{2}
        token:
          description: Device token value.
          type: string
        tokenType:
          description: The scheme which issued the network token.
          type: string
          enum:
            - APPLE_PAY
            - GOOGLE_PAY
            - SAMSUNG_PAY
        type:
          type: string
          default: DEVICE_TOKEN
      allOf:
        - $ref: '#/components/schemas/Card'
      required:
        - expiryMonth
        - expiryYear
        - token
        - tokenType
        - type
    DimocoAuthorizationRequest:
      type: object
      properties:
        alias:
          description: An alias (token) received from a previous transaction if `option.createAlias` was set to `true`. In order to retrieve the alias from a previous transaction, use the [Status API](#operation/status).
          type: string
          example: AAABeCBPbiHssdexyrAAAYkaznYWAPYt
          externalDocs:
            url: https://docs.datatrans.ch/docs/tokenization#section-token-format
    EMVCo3DAuthenticationDataAuthorizeRequest:
      description: If 3D authentication data is available, the `3D` object can be used to send the relevant 3D parameters. Please get in contact with us if you have a dedicated 3D provider.
      type: object
      properties:
        authenticationResponse:
          description: |+
            Transaction status after `RReq` (Challenge flow)

            |Value|3Dv1|3Dv2|
            |:---|:---|:---|
            |Y| authenticated| authenticated|
            |N| authentication failed| authentication failed|
            |U| not available| not available|
            |A| authentication attempt| authentication attempt|
            |C| process incomplete| process incomplete|
            |R| |authentication/account verification rejected|
            |I| |informational only|
            |D| not enrolled| |

          type: string
          enum:
            - Y
            - N
            - U
            - A
            - C
            - R
            - I
            - D
          maxLength: 1
          minLength: 1
        cavv:
          description: The Cardholder Authentication Verification Value
          type: string
        cavvAlgorithm:
          description: The 3D algorithm
          type: string
        cbAvalgo:
          type: string
        cbExemption:
          type: string
        cbScore:
          type: string
        directoryResponse:
          description: |+
            Transaction status after `ARes`

            |Value|3Dv1|3Dv2|
            |:---|:---|:---|
            |Y| enrolled| authenticated|
            |N| not enrolled| authentication failed|
            |U| not available| not available|
            |C| |challenge needed|
            |R| |rejected|
            |A| |authentication attempt|

          type: string
          enum:
            - Y
            - N
            - U
            - C
            - R
            - A
          maxLength: 1
          minLength: 1
        dsTransId:
          description: The transaction ID returned by the directory server
          type: string
        eci:
          description: The Electronic Commerce Indicator
          type: string
          enum:
            - '01'
            - '02'
            - '05'
            - '06'
            - '07'
          maxLength: 2
          minLength: 2
          pattern: \d{2}
        threeDSTransactionId:
          description: The transaction ID returned by the 3D Secure Provider
          type: string
        threeDSVersion:
          description: The 3D version
          type: string
        transStatusReason:
          description: |
            Transaction status reason

            |Value|Description|
            |:---|:---|
            |01| Card authentication failed|
            |02| Unknown Device|
            |03| Unsupported Device|
            |04| Exceeds authentication frequency limit|
            |05| Expired card|
            |06| Invalid card number|
            |07| Invalid transaction|
            |08| No Card record|
            |09| Security failure|
            |10| Stolen card|
            |11| Suspected fraud|
            |12| Transaction not permitted to cardholder|
            |13| Cardholder not enrolled in service|
            |14| Transaction timed out at the ACS|
            |15| Low confidence|
            |16| Medium confidence|
            |17| High confidence|
            |18| Very High confidence|
            |19| Exceeds ACS maximum challenges|
            |20| Non-Payment transaction not supported|
            |21| 3RI transaction not supported|
            |22| ACS technical issue|
            |23| Decoupled Authentication required by ACS but not requested by 3DS Requestor|
            |24| 3DS Requestor Decoupled Max Expiry Time exceeded|
            |25| Decoupled Authentication was provided insufficient time to authenticate cardholder. ACS will not make attempt|
            |26| Authentication attempted but not performed by the cardholder|
            |27–79| Reserved for EMVCo future use (values invalid until defined by EMVCo)|
            |80–99 | Reserved for DS use|
          type: string
          maxLength: 2
          minLength: 2
          pattern: \d{2}
        xid:
          description: The transaction ID returned by the directory server
          type: string
    ESY:
      type: object
      properties:
        alias:
