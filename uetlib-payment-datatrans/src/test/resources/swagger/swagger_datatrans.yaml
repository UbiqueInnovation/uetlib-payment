          type: boolean
        returnResources:
          description: If `true`, JavaScript resources with Subresource Integrity (SRI) information are returned in the response.
          type: boolean
          default: false
        storeCustomerData:
          description: If `true`, the values passed in the customer object are stored and visiblein the web admin tool on the transaction details. If `false`, no customer data will bestored.
          type: boolean
          default: true
