        - Basic: []
      tags:
        - /v2/transactions
      x-codeSamples:
        - label: curl
          source: |-
            curl -i -X POST https://api.sandbox.datatrans.com/v2/transactions/019f4b72-10bd-71ce-b6e6-cdee43ab0998/settle 
            	--user {merchantId}:{password} 
            	-H 'Content-Type: application/json; charset=UTF-8' 
            	-d '{
                "amount": 1000,
                "currency": "CHF",
                "refno": "fCGrnbtVw"
            }'
          lang: shell
components:
  schemas:
    AliasInfoCardInfoDetail:
      description: Information about the card behind the alias if available. For some cards (e.g. Boncard) no information will be returned.
      type: object
      properties:
        3D:
          $ref: '#/components/schemas/ThreeDInfo'
        altId:
          $ref: '#/components/schemas/TokenInfo'
        applePay:
          $ref: '#/components/schemas/ApplePay'
        authenticationMethod:
          description: The authentication method used.
          type: string
          enum:
            - PASSKEYS
            - THREE_DS
        bin:
          type: string
        cardHolderNameVerification:
          $ref: '#/components/schemas/CardHolderNameVerificationResults'
        cardInfo:
          $ref: '#/components/schemas/CardInfo'
        cardOnFile:
          $ref: '#/components/schemas/CardOnFile'
        clickToPay:
          $ref: '#/components/schemas/ClickToPay'
        expiryMonth:
          description: The expiry month of the card behind the alias. Currently not available when the Convert API was used before.
          type: string
          maxLength: 2
          minLength: 2
          pattern: \d{2}
        expiryYear:
          description: The expiry year of the card behind the alias. Currently not available when the Convert API was used before.
          type: string
          maxLength: 2
          minLength: 2
          pattern: \d{2}
        last4:
          type: string
        networkToken:
          $ref: '#/components/schemas/TokenInfo'
        panRemoved:
          description: Indicates if PAN has been removed.
          type: boolean
        passkeys:
          $ref: '#/components/schemas/Passkeys'
        usage:
          type: string
          enum:
            - SIMPLE
            - REGISTRATION
        walletIndicator:
          type: string
          enum:
            - APL
            - PAY
            - C2P
    AliasInfoResponse:
      type: object
      properties:
        alias:
          description: The requested alias.
          type: string
          example: AAABeCBPbiHssdexyrAAAYkaznYWAPYt
          externalDocs:
            url: https://docs.datatrans.ch/docs/tokenization#section-token-format
        card:
          $ref: '#/components/schemas/AliasInfoCardInfoDetail'
        dateCreated:
          description: Creation date
          type: string
          format: date-time
        fingerprint:
          description: An unique identifier of the card number. Useful to identify multiple customers' or the same customer's transactions where the same card was used.
          type: string
          example: F-coGuJQ55tUk8CnKGI9PX1T
          maxLength: 24
          minLength: 24
          pattern: F-[A-Za-z0-9_-]{22}
        masked:
          description: The nonsensitive masked representation of the value behind the alias (e.g. `490000xxxxxx0003` for aliases of type `CARD`)
          type: string
        PFP:
          $ref: '#/components/schemas/PostfinancePayAliasInfoResponse'
        type:
          type: string
          enum:
            - CARD
            - CERTIFICATE
            - PFC
            - REK
            - IBAN
            - TWI
            - KLN
            - INT
            - PAP
            - ESY
            - MFX
            - MPX
            - SWP
            - MDP
            - ALP
            - PLU
            - PFP
            - DMO
        validUntil:
          description: Valid until
          type: string
          format: date-time
    AliasesError:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/AliasesErrorCode'
        message:
          description: A human readable message indicating what went wrong.
          type: string
    AliasesErrorCode:
      type: string
      enum:
        - PLAIN_NOT_FOUND
        - INVALID_EXPIRATION
        - CLIENT_ERROR
        - CONCURRENT_LIMIT_REACHED
        - INVALID_CVV
        - UNKNOWN_ERROR
        - UNRECOGNIZED_PROPERTY
        - SERVER_ERROR
        - INVALID_FINGERPRINT
        - ILLEGAL_ARGUMENT
        - UNAUTHORIZED
        - COULD_NOT_OBTAIN_NETWORK_TOKEN
        - INVALID_PLAIN_VALUE_FOR_TEST_MODE
        - MAX_REQUESTS_PER_CALL_EXCEEDED
        - VELOCITY_ERROR
        - INVALID_PLAIN_VALUE
        - NOT_VERIFIED
        - FINGERPRINT_NOT_FOUND
        - NOT_FOUND
        - INTERNAL_ERROR
        - INVALID_JSON_PAYLOAD
        - INVALID_CONFIGURATION
        - COULD_NOT_DECRYPT_TOKEN
        - ALIAS_NOT_FOUND
        - COULD_NOT_DELETE_NETWORK_TOKEN
        - DECLINED
        - FORBIDDEN
        - INVALID_ALIAS
        - INVALID_STATE
        - INVALID_PROPERTY
        - TOKEN_PROVIDER_UNAVAILABLE
        - INVALID_HEADER
        - COULD_NOT_OBTAIN_CARD_ART
        - DELETE_NOT_ALLOWED
        - SERVICE_NOT_ALLOWED
    ApplePay:
      type: object
      properties:
        deviceManufacturerIdentifier:
          type: string
    CardHolderNameVerificationResults:
      description: Cardholder name verification results
      type: object
      properties:
        firstNameMatch:
          type: string
          enum:
            - NONE
            - PARTIAL
            - FULL
        lastNameMatch:
          type: string
          enum:
            - NONE
            - PARTIAL
            - FULL
        middleNameMatch:
          type: string
          enum:
            - NONE
            - PARTIAL
            - FULL
        nameMatch:
          type: string
          enum:
            - NONE
            - PARTIAL
            - FULL
    CardInfo:
      description: The card information if the request was done with a card object
      type: object
      properties:
        accountType:
          type: string
          enum:
            - PAN
            - TOKEN
        binLength:
          description: The bin length, if known.
          type: integer
          format: int32
        brand:
          description: The brand of the credit card (e.g. VISA CREDIT).
          type: string
        coBrand:
          description: The coBrand of the card
          type: string
        country:
          description: 2 letter ISO 3166-1 alpha-2 country code.
          type: string
        issuer:
          description: The issuer of the card.
          type: string
        type:
          description: The type of the card (`credit`, `debit` or `prepaid`). The property will not be present if the card type is unknown.
          type: string
        usage:
          description: The usage of the card (`consumer`, `corporate` or `unknown`).
          type: string
    CardOnFile:
      description: Card On File
      type: object
      properties:
        id:
          description: Card on file Id
          type: string
        tlid:
          description: The TLID is a 36-character, scheme-generated identifier that Mastercard automatically assigns to every authorisation.
          type: string
          maxLength: 36
          minLength: 0
    ClickToPay:
      description: Click to Pay data, if the alias originates from a Click to Pay transaction.
      type: object
      properties:
        expiryMonth:
          description: The expiry month of the token.
          type: string
          maxLength: 2
          minLength: 2
          pattern: \d{2}
        expiryYear:
          description: The expiry year of the token.
          type: string
          maxLength: 2
          minLength: 2
          pattern: \d{2}
        paymentAccountReference:
          description: The Payment Account Reference (PAR) associated with the Click to Pay alias.
          type: string
        token:
          description: The plain card token (DPAN) stored in the alias.
          type: string
    MultiToken:
      type: object
      properties:
        amount:
          type: integer
          format: int64
        cavv:
          type: string
        merchantIdentifier:
          type: string
    NetworkTokenError:
      type: object
      properties:
        code:
          type: string
          enum:
            - SERVICE_NOT_ALLOWED
            - TOKEN_PROVIDER_UNAVAILABLE
            - MISSING_FIELD
            - DECLINED
            - REQUIRE_ADDITIONAL_AUTHENTICATION
            - WAITING_ACTIVATION
            - INTERNAL_ERROR
            - UNKNOWN_ERROR
        message:
          type: string
    Passkeys:
      description: Passkeys (FIDO2) authentication data if available.
      type: object
      properties:
        cryptogram:
          description: The cryptogram for the Passkeys (FIDO2) authentication.
          type: string
        eci:
          description: The Electronic Commerce Indicator (ECI) for the Passkeys authentication.
          type: string
    PostfinancePayAliasInfoResponse:
      description: The PostfinancePay payload.
      type: object
      properties:
        maskedIban:
          description: The PostfinancePay masked IBAN of the according account to identify the token's account by the shopper.
          type: string
    ThreeDInfo:
      description: The 3D information of the card.
      type: object
      properties:
        cavv:
          description: The cavv of the card.
          type: string
        eci:
          description: The eci of the card.
          type: string
        multiToken:
          type: array
          items:
            $ref: '#/components/schemas/MultiToken'
    TokenInfo:
      description: Scheme token details. This information is only available if the card behind the alias has been tokenized.
      type: object
      properties:
        expiryMonth:
          description: The expiry month of the scheme token.
          type: string
          maxLength: 2
          minLength: 2
          pattern: \d{2}
        expiryYear:
          description: The expiry year of the scheme token.
          type: string
          maxLength: 2
          minLength: 2
          pattern: \d{2}
        paymentAccountReference:
          description: The Payment Account Reference of the scheme token
          type: string
          example: 5001a9f027e5629d11e3949a0800a
          maxLength: 29
          minLength: 0
        reason:
          $ref: '#/components/schemas/NetworkTokenError'
        status:
          description: The status of the scheme token
          type: string
          enum:
            - INACTIVE
            - ACTIVE
            - SUSPENDED
            - DELETED
            - PENDING
            - FAILED
        token:
          description: Scheme token
          type: string
        tokenRequestorId:
          description: The token requestor id
          type: string
    AliasesResponseBase:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/AliasesError'
    AliasConvertResponse:
      type: object
      properties:
        alias:
          description: The requested alias.
          type: string
          example: AAABeCBPbiHssdexyrAAAYkaznYWAPYt
          externalDocs:
            url: https://docs.datatrans.ch/docs/tokenization#section-token-format
    AliasConvertRequest:
      type: object
      properties:
        legacyAlias:
          description: The legacy alias
          type: string
          example: 424242SKMPRI4242
        type:
          description: Legacy alias type.
          type: string
          enum:
            - CARD
            - PFC
            - PFP
            - TWI
            - PAP
            - INT
            - REK
      discriminator:
        propertyName: type
        mapping:
          CARD: '#/components/schemas/CardAliasConvertRequest'
          PFC: '#/components/schemas/PostFinanceAliasConvertRequest'
          TWI: '#/components/schemas/TwintAliasConvertRequest'
          PAP: '#/components/schemas/PayPalAliasConvertRequest'
          INT: '#/components/schemas/ByjunoAliasConvertRequest'
          REK: '#/components/schemas/RekaAliasConvertRequest'
      oneOf:
        - $ref: '#/components/schemas/CardAliasConvertRequest'
        - $ref: '#/components/schemas/PostFinanceAliasConvertRequest'
        - $ref: '#/components/schemas/TwintAliasConvertRequest'
        - $ref: '#/components/schemas/PayPalAliasConvertRequest'
        - $ref: '#/components/schemas/ByjunoAliasConvertRequest'
        - $ref: '#/components/schemas/RekaAliasConvertRequest'
      required:
        - legacyAlias
    ByjunoAliasConvertRequest:
      type: object
      properties:
        type:
          type: string
          default: INT
      allOf:
        - $ref: '#/components/schemas/AliasConvertRequest'
      required:
        - legacyAlias
        - type
    CardAliasConvertRequest:
      type: object
      properties:
        expiryMonth:
          description: The expiry month of the card behind the alias.
          type: string
          maxLength: 2
          minLength: 2
          pattern: \d{2}
        expiryYear:
          description: The expiry year of the card behind the alias.
          type: string
          maxLength: 2
          minLength: 2
          pattern: \d{2}
        type:
          type: string
          default: CARD
      allOf:
        - $ref: '#/components/schemas/AliasConvertRequest'
      required:
        - legacyAlias
        - type
    PayPalAliasConvertRequest:
      type: object
      properties:
        type:
          type: string
          default: PAP
      allOf:
        - $ref: '#/components/schemas/AliasConvertRequest'
      required:
        - legacyAlias
        - type
    PostFinanceAliasConvertRequest:
      type: object
      properties:
        type:
          type: string
          default: PFC
      allOf:
        - $ref: '#/components/schemas/AliasConvertRequest'
      required:
        - legacyAlias
        - type
    RekaAliasConvertRequest:
      type: object
      properties:
        type:
          type: string
          default: REK
      allOf:
        - $ref: '#/components/schemas/AliasConvertRequest'
      required:
        - legacyAlias
        - type
    TwintAliasConvertRequest:
      type: object
      properties:
        type:
          type: string
          default: TWI
      allOf:
        - $ref: '#/components/schemas/AliasConvertRequest'
      required:
        - legacyAlias
        - type
    AliasPatchRequest:
      type: object
      properties:
        cardholder:
          $ref: '#/components/schemas/CardholderData'
        cardHolderNameVerification:
          $ref: '#/components/schemas/CardHolderNameVerification'
        cardOnFile:
          $ref: '#/components/schemas/CardOnFile'
        createNetworkToken:
          description: Create a Network Token.
          type: boolean
        expiryMonth:
          description: The expiry month of the card behind the alias.
          type: string
          maxLength: 2
          minLength: 2
          pattern: \d{2}
        expiryYear:
          description: The expiry year of the card behind the alias.
          type: string
          maxLength: 2
          minLength: 2
          pattern: \d{2}
        removePlain:
          description: Remove the pan from storage.
          type: boolean
    CardHolderNameVerification:
      description: Cardholder name
      type: object
      properties:
        firstName:
          description: Cardholder firstname
          type: string
        lastName:
          description: Cardholder lastname
          type: string
        middleName:
          description: Cardholder middle name
          type: string
    CardholderData:
      type: object
      properties:
        emailAddress:
          description: Email address.
          type: string
        ipAddress:
          description: IP address.
          type: string
        phoneNumber:
          description: Phone number.
          type: string
          maxLength: 50
    BulkTokenizeResponse:
      type: object
      properties:
        overview:
          $ref: '#/components/schemas/ResponseOverview'
        responses:
          description: List of tokenization responses.
          items:
            $ref: '#/components/schemas/TokenizeResponse'
          type: array
    CardTokenizeResponse:
      type: object
      properties:
        alias:
          description: The requested alias.
          type: string
          example: AAABeCBPbiHssdexyrAAAYkaznYWAPYt
        fingerprint:
          description: An unique identifier of the card number. Useful to identify multiple customers' or the same customer's transactions where the same card was used.
          type: string
          example: F-coGuJQ55tUk8CnKGI9PX1T
          maxLength: 24
          minLength: 24
          pattern: F-[A-Za-z0-9_-]{22}
        maskedCC:
          description: The nonsensitive masked representation of the value behind the alias.
          type: string
          example: 490000xxxxxx0003
        networkToken:
          $ref: '#/components/schemas/NetworkTokenInfo'
        type:
          type: string
          default: CARD
        validUntil:
          description: Valid until
          type: string
          format: date-time
      allOf:
        - $ref: '#/components/schemas/TokenizeResponse'
      required:
        - type
    CertificateMetadata:
      description: The certificate metadata.
      type: object
      properties:
        expiration:
          description: Certificate expiration.
          type: string
          format: date-time
        sha1Fingerprint:
          description: Certificate SHA-1 fingerprint.
          type: string
    CertificateTokenizeResponse:
      type: object
      properties:
        alias:
          description: The requested alias.
          type: string
          example: AAABeCBPbiHssdexyrAAAYkaznYWAPYt
        certificates:
          description: The certificate metadata.
          type: array
          items:
            $ref: '#/components/schemas/CertificateMetadata'
        type:
          type: string
          default: CERTIFICATE
      allOf:
        - $ref: '#/components/schemas/TokenizeResponse'
      required:
        - type
    CustomTokenizeResponse:
      type: object
      properties:
        alias:
          description: The requested alias.
          type: string
          example: AAABeCBPbiHssdexyrAAAYkaznYWAPYt
        type:
          type: string
          default: CUSTOM
      allOf:
        - $ref: '#/components/schemas/TokenizeResponse'
      required:
        - type
    CvvTokenizeResponse:
      type: object
      properties:
        alias:
          description: The requested CVV alias. CVV aliases have a limited lifespan of 30 minutes and can't be detokenized anymore when expired.
          type: string
          example: oE9AUiL1S36de4oSVOkSaLVt
        expiryDate:
          description: The alias expiration date.
          type: string
          format: date-time
        type:
          type: string
          default: CVV
      allOf:
        - $ref: '#/components/schemas/TokenizeResponse'
      required:
        - type
    NetworkTokenInfo:
      type: object
      properties:
        expiryMonth:
          type: string
        expiryYear:
          type: string
