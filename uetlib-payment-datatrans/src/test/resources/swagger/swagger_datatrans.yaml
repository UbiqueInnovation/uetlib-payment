    CardOnFileInit:
      description: |-
        Card On File (COF) parameters. COF usually is handled by Datatrans aliases. This feature is only for specific use cases where the Datatrans alias solution cannot be used.
        This feature needs to be enabled on the merchant configuration by Datatrans.
      type: object
      properties:
        enroll:
          description: If `true`, a Card On File (COF) enrollment is performed. The created card on file ID will be returned in the webhook after a successful authorization. This COF ID can be reused in subsequent MIT authorizations.
          type: boolean
        id:
          description: The card on file ID to be used for this transaction.
          type: string
    Cardholder:
      description: |
        Contains information for the Cardholder.
        This field is required unless market or regional mandate restricts sending this information.
      type: object
      properties:
        addrMatch:
          type: string
          enum:
            - Y
            - N
        billAddrCity:
          description: |
            The city of the Cardholder billing address associated with the card used for this
            purchase. This field is limited to maximum of 50 characters.

            Required unless market or regional mandate restricts sending this information.
          type: string
        billAddrCountry:
          description: |
            The country of the Cardholder billing address associated with the card used for this
            purchase. This field is limited to 3 characters. This value shall be the ISO 3166-1
            numeric country code, except values from range 901 - 999 which are reserved by ISO.
          type: string
        billAddrLine1:
          description: |
            First line of the street address or equivalent local portion of the Carholder billing
            address associated with the card use for this purchase. This field is limited to maximum
            50 characters.
          type: string
        billAddrLine2:
          description: |
            Second line of the street address or equivalent local portion of the Carholder billing
            address associated with the card use for this purchase. This field is limited to maximum
            50 characters.
          type: string
        billAddrLine3:
          description: |
            Third line of the street address or equivalent local portion of the Carholder billing
            address associated with the card use for this purchase. This field is limited to maximum
            50 characters.
          type: string
        billAddrPostCode:
          description: |
            ZIP or other postal code of the Cardholder billing address associated with the card used
            for this purchase. This field is limited to maximum 16 characters.
          type: string
        billAddrState:
          description: |
            The state or province of the Cardholder billing address associated with the card used
            for this purchase.  This field is limited to 3 characters. The value should be the
            country subtivision code defined in ISO 3166-2.
          type: string
        cardholderName:
          description: |
            Name of the Cardholder. This field is limited to maximum of 50 characters.

            This field is required unless market or regional mandate restricts sending this
            information.
          type: string
        email:
          description: |
            The email address associated with the account that is either entered by the Cardholder,
            or is on file with the 3DS Requestor. This field is limited to maximum 256 characters
            and shall meet requirements of Section 3.4 of IETF RFC 5322.

            This field is required unless market or regional mandate restricts sending this
            information.
          type: string
        homePhone:
          $ref: '#/components/schemas/CardholderPhoneNumber'
        mobilePhone:
          $ref: '#/components/schemas/CardholderPhoneNumber'
        shipAddrCity:
          description: |
            City portion of the shipping address requested by the Cardholder.
          type: string
        shipAddrCountry:
          description: |
            Country of the shipping address requested by the Cardholder. This field is limited to 3
            characters. This value shall be the ISO 3166-1 numeric country code, except values from
            range 901 - 999 which are reserved by ISO.
          type: string
        shipAddrLine1:
          description: |
            First line of the street address or equivalent local portion of the shipping address
            associated with the card use for this purchase. This field is limited to maximum 50
            characters.
          type: string
        shipAddrLine2:
          description: |
            Second line of the street address or equivalent local portion of the shipping address
            associated with the card use for this purchase. This field is limited to maximum 50
            characters.
          type: string
        shipAddrLine3:
          description: |
            Third line of the street address or equivalent local portion of the shipping address
            associated with the card use for this purchase. This field is limited to maximum 50
            characters.
          type: string
        shipAddrPostCode:
          description: |
            ZIP or other postal code of the shipping address associated with the card used for this
            purchase. This field is limited to maximum 16 characters.
          type: string
        shipAddrState:
          description: |
            The state or province of the shipping address associated with the card used for this
            purchase. This field is limited to 3 characters. The value should be the country
            subtivision code defined in ISO 3166-2.
          type: string
        workPhone:
          $ref: '#/components/schemas/CardholderPhoneNumber'
    CardholderAccount:
      description: Contains information for the Cardholder Account.
      type: object
      properties:
        acctID:
          type: string
        acctInfo:
          $ref: '#/components/schemas/CardholderAccountInformation'
        cardExpiryDate:
          type: string
