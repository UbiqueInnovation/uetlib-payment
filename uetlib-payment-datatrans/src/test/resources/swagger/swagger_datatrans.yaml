  /v1/reconciliations/sales:
    post:
      operationId: saleReport
      summary: Report a sale
      description: If you are a merchant using our reconciliation services, you can use this API to confirm a sale. The matching is based on the `transactionId`. The status of the transaction will change to `compensated`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaleReportRequest'
            examples:
              saleReportRequest:
                summary: Basic sale report request
                description: saleReportRequest
                value:
                  date: 2026-07-10T09:53:04.718+00:00
                  transactionId: '260710115304081363'
                  currency: CHF
                  amount: 1000
                  type: payment
                  refno: ZYL2f7MBI
      responses:
        '200':
          description: Transaction successfully reported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleReportResponse'
              examples:
                saleReportResponse:
                  description: saleReportResponse
                  value:
                    transactionId: '260710115304081363'
                    saleDate: 2026-07-10T09:53:04.718+00:00
                    reportedDate: 2026-07-10T09:53:04.853+00:00
                    matchResult: MATCHED
      security:
        - Basic: []
      tags:
        - /v1/reconciliations
      x-codeSamples:
        - label: curl
          source: |-
            curl -i -X POST https://api.sandbox.datatrans.com/v1/reconciliations/sales 
            	--user {merchantId}:{password} 
            	-H 'Content-Type: application/json; charset=UTF-8' 
            	-d '{
                "date": "2026-07-10T09:53:04.718+00:00",
                "transactionId": "260710115304081363",
                "currency": "CHF",
                "amount": 1000,
                "type": "payment",
                "refno": "ZYL2f7MBI"
            }'
          lang: shell
  /v1/reconciliations/sales/bulk:
    post:
      operationId: bulkSaleReport
      summary: Bulk reporting of sales
      description: If you are a merchant using our reconciliation services, you can use this API to confirm multiple sales with a single API call. The matching is based on the `transactionId`. The status of the transaction will change to `compensated`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkSaleReportRequest'
            examples:
              bulkSaleRequest:
                summary: Basic bulk sale request
                description: bulkSaleRequest
                value:
                  sales:
                    - date: 2026-07-10T09:53:05.520+00:00
                      transactionId: '260710115305161424'
                      currency: CHF
                      amount: 1000
                      type: payment
                      refno: KF6InvKDi
                    - date: 2026-07-10T09:53:05.835+00:00
                      transactionId: '260710115305571462'
                      currency: CHF
                      amount: 1000
                      type: payment
                      refno: vUjpZUPkP
      responses:
        '200':
          description: Transactions successfully reported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleReportResponse'
              examples:
                bulkSaleResponse:
                  description: bulkSaleResponse
                  value:
                    sales:
                      - transactionId: '260710115305161424'
                        saleDate: 2026-07-10T09:53:05.520+00:00
                        reportedDate: 2026-07-10T09:53:05.902+00:00
                        matchResult: MATCHED
                      - transactionId: '260710115305571462'
                        saleDate: 2026-07-10T09:53:05.835+00:00
                        reportedDate: 2026-07-10T09:53:05.928+00:00
                        matchResult: MATCHED
      security:
        - Basic: []
      tags:
        - /v1/reconciliations
      x-codeSamples:
        - label: curl
          source: |-
            curl -i -X POST https://api.sandbox.datatrans.com/v1/reconciliations/sales/bulk 
            	--user {merchantId}:{password} 
            	-H 'Content-Type: application/json; charset=UTF-8' 
            	-d '{
                "sales": [
                    {
                        "date": "2026-07-10T09:53:05.520+00:00",
                        "transactionId": "260710115305161424",
                        "currency": "CHF",
                        "amount": 1000,
                        "type": "payment",
                        "refno": "KF6InvKDi"
                    },
                    {
                        "date": "2026-07-10T09:53:05.835+00:00",
                        "transactionId": "260710115305571462",
                        "currency": "CHF",
                        "amount": 1000,
                        "type": "payment",
                        "refno": "vUjpZUPkP"
                    }
                ]
            }'
          lang: shell
