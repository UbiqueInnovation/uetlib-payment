        type:
          type: string
          default: GOOGLE_PAY
      allOf:
        - $ref: '#/components/schemas/TokenizeRequest'
      required:
        - type
    TokenizeNetworkTokenOptions:
      type: object
      properties:
        createNetworkToken:
          description: Create a Network Token.
          type: boolean
    TokenizeRequest:
      description: List of tokenization requests.
      type: object
      properties:
        type:
          type: string
          enum:
            - CARD
            - CVV
            - CUSTOM
            - APPLE_PAY
            - GOOGLE_PAY
            - CERTIFICATE
      discriminator:
        propertyName: type
        mapping:
          CARD: '#/components/schemas/CardTokenizeRequest'
          CVV: '#/components/schemas/CvvTokenizeRequest'
          CUSTOM: '#/components/schemas/CustomTokenizeRequest'
          APPLE_PAY: '#/components/schemas/ApplePayTokenizeRequest'
          GOOGLE_PAY: '#/components/schemas/GooglePayTokenizeRequest'
          CERTIFICATE: '#/components/schemas/CertificateTokenizeRequest'
      oneOf:
        - $ref: '#/components/schemas/CardTokenizeRequest'
        - $ref: '#/components/schemas/CvvTokenizeRequest'
        - $ref: '#/components/schemas/CustomTokenizeRequest'
        - $ref: '#/components/schemas/ApplePayTokenizeRequest'
        - $ref: '#/components/schemas/GooglePayTokenizeRequest'
    AliasCardArtResponse:
      type: object
      properties:
        encodedData:
          type: string
        mimeType:
          type: string
    BulkDetokenizeResponse:
      type: object
      properties:
        overview:
          $ref: '#/components/schemas/ResponseOverview'
        responses:
          description: List of detokenization responses.
          items:
            $ref: '#/components/schemas/DetokenizeResponse'
          type: array
    CardDetokenizeResponse:
      type: object
      properties:
        expiryMonth:
          description: The expiry month of the card.
          type: string
          maxLength: 2
          minLength: 2
          pattern: \d{2}
        expiryYear:
          description: The expiry year of the card.
          type: string
          maxLength: 2
          minLength: 2
          pattern: \d{2}
        networkToken:
          $ref: '#/components/schemas/NetworkToken'
        pan:
          description: The card number.
          type: string
          maxLength: 19
          minLength: 13
          pattern: \d{13,19}
        type:
          type: string
          default: CARD
        validUntil:
          description: Valid until
          type: string
          format: date-time
      allOf:
        - $ref: '#/components/schemas/DetokenizeResponse'
      required:
        - type
    CertificateDetokenizeResponse:
      type: object
      properties:
        certificate:
          description: The detokenized plain value.
          type: string
        type:
          type: string
          default: CERTIFICATE
      allOf:
        - $ref: '#/components/schemas/DetokenizeResponse'
      required:
        - type
    CustomDetokenizeResponse:
      type: object
      properties:
        custom:
          description: The detokenized plain value.
          type: string
          maxLength: 7500
          pattern: \d{0,7500}
        type:
          type: string
          default: CUSTOM
      allOf:
        - $ref: '#/components/schemas/DetokenizeResponse'
      required:
        - type
    CvvDetokenizeResponse:
      type: object
