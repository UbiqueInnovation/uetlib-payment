          type: string
        type:
          type: string
          default: APPLE_PAY
      allOf:
        - $ref: '#/components/schemas/TokenizeRequest'
      required:
        - type
    BulkTokenizeRequest:
      type: object
      properties:
        requests:
          description: List of tokenization requests.
          type: array
          items:
            $ref: '#/components/schemas/TokenizeRequest'
      required:
        - requests
    CardTokenizeRequest:
      type: object
      properties:
        cardholder:
          $ref: '#/components/schemas/CardholderData'
        expiryMonth:
          description: The expiry month of the card.
          type: string
          maxLength: 2
          minLength: 2
          pattern: \d{2}
        expiryYear:
          description: The expiry year of the card.
          type: string
          maxLength: 2
          minLength: 2
          pattern: \d{2}
        networkTokenOptions:
