  contact:
    url: https://docs.datatrans.ch
    email: support@datatrans.ch
  version: 2.0.59
  x-logo:
    url: https://gist.githubusercontent.com/marcj-planet/4a6cd7f10bc342eaf751968133fd88fa/raw/82e2bf993847bfcc4e5088abefdb20ebcc5fdcd9/logo.svg
    backgroundColor: '#FAFAFA'
